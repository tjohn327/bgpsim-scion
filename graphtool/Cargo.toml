[package]
name = "graphtool"
version = "0.1.0"
edition = "2021"
description = "Graph-tool graph loader for bgpsim SCION simulation"

[dependencies]
bgpsim = { path = "../bgpsim", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
flate2 = "1"

[dev-dependencies]
pretty_assertions = "1"

[[example]]
name = "load_scion_graph"
path = "examples/load_scion_graph.rs"
